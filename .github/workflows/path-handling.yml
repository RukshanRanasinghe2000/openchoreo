name: LSP and Linter Path Compatibility
on:
  pull_request:
    paths:
      - 'internal/pathutil/**'
      - 'internal/occ/cmd/lint/**'
      - 'tools/lint/**'
      - 'tools/lsp/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/path-handling.yml'
  push:
    branches: [main]
    paths:
      - 'internal/pathutil/**'
      - 'internal/occ/cmd/lint/**'
      - 'tools/lint/**'
      - 'tools/lsp/**'
      - '.github/workflows/path-handling.yml'
permissions:
  contents: read
jobs:
  native-tests:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-go
      - name: Run native unit, protocol, watcher, validation and CLI contract tests
        run: go test ./internal/pathutil ./tools/lint/... ./tools/lsp/... ./internal/occ/cmd/lint/... -count=1
      - name: Check races on Unix runners
        if: runner.os != 'Windows'
        run: go test -race ./internal/pathutil ./tools/lint/... ./tools/lsp/...
  cross-build:
    name: Compile occ (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-go
      - name: Cross-compile unified CLI (not a runtime test)
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o bin/cross/occ-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/occ
