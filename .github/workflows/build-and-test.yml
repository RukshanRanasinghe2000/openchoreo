name: Build and Test
on:
  push:
    branches:
      - "main"
      - "release-v*"
  pull_request:
    branches:
      - "main"
      - "release-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  OCI_REGISTRY_HOST: ${{ vars.OCI_REGISTRY_HOST || 'ghcr.io' }}
  IMAGE_REPO_PREFIX: ${{ vars.IMAGE_REPO_PREFIX || 'ghcr.io/openchoreo' }}
  HELM_OCI_REGISTRY: ${{ vars.HELM_OCI_REGISTRY || 'oci://ghcr.io/openchoreo/helm-charts' }}
  PUBLISH_LATEST: ${{ vars.PUBLISH_LATEST || 'true' }}
  IMAGE_PLATFORMS: ${{ github.event_name == 'push' && 'linux/amd64 linux/arm64' || 'linux/amd64' }}
  CLI_EXTRA_PLATFORMS: ${{ github.event_name == 'push' && 'darwin/amd64 darwin/arm64 windows/amd64 windows/arm64' || '' }}

jobs:
  templates:
    name: Generate release templates
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Test release template coordinator
        run: go test ./hack/release-templates -count=1
      - name: Generate and validate latest-only snapshot
        run: make release.templates
      - name: Upload release template snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-templates
          path: bin/release-templates/
          if-no-files-found: error
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Release branches must not install 0.0.0-latest-dev observability modules
      # (e.g. reintroduced by a backport from main).
      - name: Check observability module pins
        if: startsWith(github.base_ref, 'release-v') || startsWith(github.ref_name, 'release-v')
        run: hack/pin-observability-modules.sh --check

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run linter
        run: make lint

  gen-check:
    name: Code Generation
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run Code Generation Checks
        run: make code.gen-check

  test:
    needs: templates
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Required for Codecov OIDC
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Download validated templates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-templates
          path: bin/release-templates
      - name: Prepare isolated test source
        run: go run ./hack/release-templates prepare --workspace "$RUNNER_TEMP/occ-test-source"
      - name: Running Tests
        run: |
          make -C "$RUNNER_TEMP/occ-test-source" go.test
          cp "$RUNNER_TEMP/occ-test-source/cover.out" cover.out

      - name: Upload coverage to Codecov
        if: vars.CODECOV_ENABLED != 'false'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./cover.out
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

  build:
    needs: [templates, test]
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Download validated templates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-templates
          path: bin/release-templates
      - name: Build multiarch binaries
        run: |
          make go.build-multiarch GO_EXCLUDE_BINARIES=occ GO_TARGET_PLATFORMS="${{ env.IMAGE_PLATFORMS }}"
          go run ./hack/release-templates build --snapshot bin/release-templates --platforms "${{ env.IMAGE_PLATFORMS }} ${{ env.CLI_EXTRA_PLATFORMS }}"

      - name: Smoke test compiled release outside checkout
        run: OCC_RELEASE_BINARY="$PWD/bin/dist/linux/amd64/occ" go test ./hack/release-templates -run '^TestReleaseBinary$' -count=1

      - name: Upload occ binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: occ
          path: bin/dist/**/occ

      - name: Upload manager binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manager
          path: bin/dist/**/manager

      - name: Upload openchoreo-api binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openchoreo-api
          path: bin/dist/**/openchoreo-api

      - name: Upload observer binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observer
          path: bin/dist/**/observer

      - name: Upload event-forwarder binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-forwarder
          path: bin/dist/**/event-forwarder

      - name: Upload cluster-gateway binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-gateway
          path: bin/dist/**/cluster-gateway

      - name: Upload cluster-agent binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-agent
          path: bin/dist/**/cluster-agent

      - name: Upload remote-agent binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-agent
          path: bin/dist/**/remote-agent

      - name: Upload remote-agent-router binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-agent-router
          path: bin/dist/**/remote-agent-router

  agent-tests:
    name: Agent Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: agents/*/uv.lock

      - name: Run tests
        # uv reads each agent's .python-version (3.14) and provisions the
        # interpreter. ruff lint/format is intentionally deferred until the
        # pre-existing src/ debt is cleaned up; this gates on pytest only.
        run: make python.test

  package-helm:
    name: Package Helm Charts
    runs-on: ubuntu-24.04
    if: github.event_name != 'push'
    needs: [ lint, gen-check, test, build, agent-tests ]
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Package helm charts
        run: make helm-package

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [ lint, gen-check, test, build, agent-tests ]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-candidates.yml
    secrets:
      OCI_REGISTRY_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
      OCI_REGISTRY_PASSWORD: ${{ secrets.OCI_REGISTRY_PASSWORD }}
